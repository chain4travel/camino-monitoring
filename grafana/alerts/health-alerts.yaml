# Health Status Alerts
# These alerts monitor the health of various Camino network services
# The __ENV__ placeholder will be replaced by the installer script

apiVersion: 1

groups:
  # Public API Health
  - orgId: 1
    name: public-api-health
    folder: alerts
    interval: 30s
    rules:
      - uid: public-api-health-1
        title: Public API Node Health
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: builder
              expr: 'public_api_health_status{instance="push_daemon", job="health_status"}'
              hide: false
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: B
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        for: 2m
        annotations:
          summary: Public API Node for Camino (__ENV__) is not healthy
        labels:
          env: __ENV__
          severity: high
        noDataState: Alerting
        execErrState: Alerting

